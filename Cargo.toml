[workspace]
resolver = "2"
members = [
    "crates/newviso-contract-api",
    "crates/newviso-service-api",
    "crates/newviso-ui-draw",
    "crates/newviso-render-api",
    "crates/newviso-visibility-api",
    "crates/newviso-loading-api",
    "crates/newviso-task-api",
    "crates/newviso-steering",
    "crates/newviso-character",
    "crates/newviso-navigation",
    "crates/newviso-agent",
    "crates/newviso-bugtrap",
    "crates/newviso-audio-client",
    "crates/newviso-audio-api",
    "apps/newviso",
    "apps/newviso-bugtrap",
    "crates/newviso-scripting",
    "crates/newviso-ui-client",
    "crates/newviso-script-client",
    "crates/newviso-assets-client",
    "crates/newviso-capabilities",
    "crates/newviso-compat-abi",
    "crates/newviso-config",
    "crates/newviso-collision",
    "crates/newviso-content-manager",
    "crates/newviso-core",
    "crates/newviso-events",
    "crates/newviso-host",
    "crates/newviso-input-client",
    "crates/newviso-items",
    "crates/newviso-noise-api",
    "crates/newviso-platform",
    "crates/newviso-physics-api",
    "crates/newviso-physics-client",
    "crates/newviso-provider-runtime",
    "crates/newviso-project",
    "crates/newviso-render-client",
    "crates/newviso-runtime",
    "crates/newviso-resource-runtime",
    "crates/newviso-textures",
    "crates/newviso-materials",
    "crates/newviso-model",
    "crates/newviso-rsc7-import",
    "crates/newviso-scene",
    "crates/newviso-world",
    "crates/newviso-vehicle",
]
default-members = ["apps/newviso"]

[workspace.package]
edition = "2021"
license = "Proprietary"
version = "0.1.0"

[workspace.dependencies]
newviso-contract-api = { path = "crates/newviso-contract-api" }
newviso-service-api = { path = "crates/newviso-service-api" }
newviso-ui-draw = { path = "crates/newviso-ui-draw" }
newviso-render-api = { path = "crates/newviso-render-api" }
newviso-visibility-api = { path = "crates/newviso-visibility-api" }
newviso-loading-api = { path = "crates/newviso-loading-api" }
newviso-task-api = { path = "crates/newviso-task-api" }
newviso-steering = { path = "crates/newviso-steering" }
newviso-character = { path = "crates/newviso-character" }
newviso-navigation = { path = "crates/newviso-navigation" }
newviso-agent = { path = "crates/newviso-agent" }
newviso-bugtrap = { path = "crates/newviso-bugtrap" }
newviso-audio-api = { path = "crates/newviso-audio-api" }
newviso-audio-client = { path = "crates/newviso-audio-client" }
newviso-scripting = { path = "crates/newviso-scripting" }
newviso-ui-client = { path = "crates/newviso-ui-client" }
newviso-script-client = { path = "crates/newviso-script-client" }
newviso-assets-client = { path = "crates/newviso-assets-client" }
newviso-capabilities = { path = "crates/newviso-capabilities" }
newviso-compat-abi = { path = "crates/newviso-compat-abi" }
newviso-config = { path = "crates/newviso-config" }
newviso-collision = { path = "crates/newviso-collision" }
newviso-content-manager = { path = "crates/newviso-content-manager" }
newviso-core = { path = "crates/newviso-core" }
newviso-events = { path = "crates/newviso-events" }
newviso-host = { path = "crates/newviso-host" }
newviso-input-client = { path = "crates/newviso-input-client" }
newviso-items = { path = "crates/newviso-items" }
newviso-noise-api = { path = "crates/newviso-noise-api" }
newviso-platform = { path = "crates/newviso-platform" }
newviso-physics-api = { path = "crates/newviso-physics-api" }
newviso-physics-client = { path = "crates/newviso-physics-client" }
newviso-provider-runtime = { path = "crates/newviso-provider-runtime" }
newviso-project = { path = "crates/newviso-project" }
newviso-render-client = { path = "crates/newviso-render-client" }
newviso-runtime = { path = "crates/newviso-runtime" }
newviso-resource-runtime = { path = "crates/newviso-resource-runtime" }
newviso-textures = { path = "crates/newviso-textures" }
newviso-materials = { path = "crates/newviso-materials" }
newviso-model = { path = "crates/newviso-model" }
newviso-semantic-assets = { path = "crates/newviso-rsc7-import" }
newviso-scene = { path = "crates/newviso-scene" }
newviso-world = { path = "crates/newviso-world" }
newviso-vehicle = { path = "crates/newviso-vehicle" }

abi_stable = "0.11"
blake3 = "1"
flate2 = "1"
libloading = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
